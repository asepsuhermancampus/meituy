name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true

    - name: Install dependencies
      run: flutter pub get

    - name: Analyze
      run: flutter analyze --fatal-infos

    - name: Test
      run: flutter test

    - name: Build Debug APK
      run: flutter build apk --debug

    - name: Rename APK
      run: |
        cd build/app/outputs/flutter-apk
        mv app-debug.apk meituy-debug-build${{ github.run_number }}.apk

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Meituy-Debug-APK
        path: build/app/outputs/flutter-apk/*.apk
        retention-days: 90
