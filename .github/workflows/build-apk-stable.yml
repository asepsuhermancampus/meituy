name: Build Debug APK (Stable)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: |
        ./gradlew clean assembleDebug --stacktrace
        ls -la app/build/outputs/apk/debug/
        
    - name: Get version info
      id: info
      run: |
        VERSION=$(grep "versionName" app/build.gradle.kts | awk -F'"' '{print $2}')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
        echo "run=${{ github.run_number }}" >> $GITHUB_OUTPUT
        
    - name: Rename APK
      run: |
        cd app/build/outputs/apk/debug
        mv app-debug.apk meituy-v${{ steps.info.outputs.version }}-build${{ steps.info.outputs.run }}.apk
        ls -la
        
    - name: Upload APK
      uses: actions/upload-artifact@v5
      with:
        name: Meituy-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 90