name: Android CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build with Gradle
      run: ./gradlew assembleRelease --stacktrace
      
    - name: Get version name
      id: version
      run: |
        VERSION=$(grep "versionName" app/build.gradle.kts | awk -F'"' '{print $2}')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
        
    - name: Rename APK
      run: |
        cd app/build/outputs/apk/release
        if [ -f "app-release-unsigned.apk" ]; then
          mv app-release-unsigned.apk meituy-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.date }}.apk
        elif [ -f "app-release.apk" ]; then
          mv app-release.apk meituy-v${{ steps.version.outputs.version }}-${{ steps.version.outputs.date }}.apk
        fi
        
    - name: Upload APK as artifact
      uses: actions/upload-artifact@v5
      with:
        name: meituy-apk-release
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30